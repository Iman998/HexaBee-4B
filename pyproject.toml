[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pct4b-reproducibility"
version = "0.1.0"
description = "Reproducible data, training configuration, and evaluation code for HexaBee-4B"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3", "ijson>=3.2,<4"]

[project.optional-dependencies]
metrics = ["sacrebleu==2.5.1"]
plots = ["matplotlib>=3.7,<4"]
comet = ["unbabel-comet==2.2.7"]
hub = ["huggingface-hub>=1.0,<2", "pyarrow>=18,<24", "PyYAML>=6,<7"]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
pct4b = "pct4b.cli:main"
hexabee = "pct4b.cli:main"
hexabee-hub = "pct4b.hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
pct4b = ["assets/*.json", "assets/*.txt", "assets/hub-overviews/*.png"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
